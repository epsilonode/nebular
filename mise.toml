[tools]
node = "22.23.2"
bun = "1.4.0"

[tasks.install]
description = "Install the pinned Teleport package dependencies"
run = "bun install --frozen-lockfile"

[tasks.link]
description = "Register @epsilonode/nebular for adjacent Bun development consumers"
depends = ["build"]
run = "bun link"

[tasks.check]
description = "Run the strict TypeScript check"
run = "bun run check"

[tasks.test]
description = "Run the Teleport conformance and integration tests"
run = "bun run test"

[tasks.test-live]
description = "Run opt-in host, keychain, PM2, IPC, and platform conformance"
depends = ["build"]
run = "bun run test:live"

[tasks.test-live-pm2]
description = "Run the Windows PM2 read-only AMP methods/version compatibility proof"
run = "bun run test:live:pm2"

[tasks.test-live-pm2-receiver]
description = "Run the opt-in Windows PM2 exact-name one-shot lifecycle proof"
run = "bun run test:live:pm2-receiver"

[tasks.test-live-bootstrap-denial]
description = "Prove the production Windows bootstrap root rejects absent durable authority"
run = "bun run test:live:bootstrap-denial"

[tasks.test-live-windows-filesystem]
description = "Opt in to the live canonical Windows filesystem and no-reparse proof"
depends = ["build"]
run = "bun run test:live:windows-filesystem"

[tasks.test-live-broker-e2e-preflight]
description = "Pack/install all four artifacts, commit and admit the isolated recipe, then prove cleanup"
depends = ["build"]
run = "bun run test:live:broker-e2e-preflight"

[tasks.test-live-broker-e2e]
description = "Run the isolated four-artifact credential broker E2E through PM2 and Windows"
depends = ["build"]
run = "bun run test:live:broker-e2e"

[tasks.verify]
description = "Run all Teleport package checks"
run = "bun run verify"

[tasks.build]
description = "Build the four standalone Nebular JavaScript artifacts and declarations"
run = "bun run build"

[tasks.verify-artifacts]
description = "Verify the exact four-artifact inventory and authority graphs"
run = "bun run verify:artifacts"

[tasks.verify-teleport-github-release]
description = "Verify an immutable GitHub/esm.sh compiled teleport.js release ref"
run = "bun run verify:teleport-github-release"

[tasks.verify-declarations]
description = "Resolve all four package declaration surfaces from a consumer fixture"
run = "bun run verify:declarations"

[tasks.verify-installed]
description = "Pack and install Nebular into an isolated consumer and prove all four runtime/type surfaces"
depends = ["build"]
run = "bun run verify:installed"

[tasks.verify-lint-policy]
description = "Prove the hard-FP and authority-boundary rules with negative fixtures"
run = "bun run verify:lint-policy"

[tasks.verify-type-policy]
description = "Prove illegal trust, authority, exposure, and provider states do not compile"
run = "bun run verify:type-policy"
